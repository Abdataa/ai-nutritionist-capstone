model:
  base_model: "mistralai/Mistral-7B-Instruct-v0.2"
  tokenizer: "mistralai/Mistral-7B-Instruct-v0.2"

training:
  epochs: 3
  batch_size: 1
  learning_rate: 2e-5
  max_seq_length: 2048
  gradient_accumulation_steps: 4

dataset:
  path: "../dataset/mealplans.jsonl"
  format: "instruction"

hardware:
  device: "cuda"
  mixed_precision: true

output:
  save_dir: "./fine_tuned_model"
